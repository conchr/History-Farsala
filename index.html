<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Φάρσαλα: 7,000 Χρόνια Ιστορίας</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2c5530;
            --secondary: #4a7c59;
            --accent: #8fbc8f;
            --light: #f8f9fa;
            --dark: #1a1a1a;
            --timeline: #8b4513;
            --bronze: #cd7f32;
            --gold: #ffd700;
            --papyrus: #f5e9d3;
        }

        body {
            background: 
                linear-gradient(rgba(245, 233, 211, 0.9), rgba(245, 233, 211, 0.9)),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" opacity="0.1"><rect width="100%" height="100%" fill="%238b4513"/><path d="M0,0 L400,400 M400,0 L0,400" stroke="%235a3921" stroke-width="2"/></svg>'),
                var(--papyrus);
            color: var(--dark);
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
            min-height: 100vh;
        }

        .municipality-label {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: bold;
            z-index: 100;
            background: rgba(245, 233, 211, 0.95);
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid #d4c4a8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 50px;
            min-height: calc(100vh - 120px);
        }

        /* Slides */
        .slides-container {
            position: relative;
            min-height: 70vh;
        }

        .slide {
            display: none;
            animation: fadeIn 0.8s ease forwards;
            min-height: 70vh;
        }

        .slide.active {
            display: block;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            border: 2px solid #d4c4a8;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--gold) 100%);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Main Content - No Scroll */
        .main-content {
            display: block;
            margin-top: 1rem;
            overflow: visible;
        }

        @media (max-width: 768px) {
            .municipality-label {
                position: relative;
                top: 0;
                left: 0;
                text-align: center;
                margin-bottom: 10px;
            }
            
            .container {
                padding-top: 20px;
            }
        }

        .content-section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #d4c4a8;
            backdrop-filter: blur(10px);
            overflow: visible;
        }

        .content-section h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 0.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .info-card {
            background: rgba(248, 249, 250, 0.8);
            padding: 1.5rem;
            border-radius: 10px;
            border-left: 4px solid var(--secondary);
            transition: transform 0.3s ease;
            border: 1px solid #e9dcc9;
        }

        .info-card:hover {
            transform: translateX(5px);
        }

        .info-card h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        /* Extended Info Sections */
        .extended-info {
            margin-top: 2rem;
        }

        .info-section {
            background: linear-gradient(135deg, rgba(248,249,250,0.8) 0%, rgba(233,236,239,0.8) 100%);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent);
            border: 1px solid #e9dcc9;
        }

        .info-section h3 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .info-section ul {
            list-style-type: none;
            padding-left: 0;
        }

        .info-section li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #dee2e6;
            position: relative;
            padding-left: 1.5rem;
        }

        .info-section li:before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--secondary);
            font-weight: bold;
        }

        .info-section li:last-child {
            border-bottom: none;
        }

        /* Footer Navigation */
        .footer-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding: 1rem 0;
            border-top: 2px solid #d4c4a8;
            position: relative;
        }

        .nav-btn {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #2c5530;
        }

        .nav-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .nav-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            border: 1px solid #b3b3b3;
        }

        .home-btn {
            padding: 12px 25px;
            background: var(--accent);
            color: var(--dark);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #8fbc8f;
        }

        .home-btn:hover {
            background: #7ca87c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 2rem 0;
            overflow: hidden;
            border: 1px solid #d4c4a8;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Slide Counter */
        .slide-counter {
            text-align: center;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            background: rgba(245, 233, 211, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid #d4c4a8;
        }

        .counter-container {
            text-align: center;
            margin-bottom: 1rem;
        }

        /* Introduction Slide */
        .intro-slide {
            text-align: center;
            padding: 2rem;
        }

        .intro-slide h2 {
            color: var(--primary);
            margin-bottom: 2rem;
            font-size: 2.2rem;
        }

        /* Thank You Slide */
        .thank-you-slide {
            text-align: center;
            padding: 4rem 2rem;
        }

        .thank-you-slide h2 {
            color: var(--primary);
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        .thank-you-slide p {
            font-size: 1.3rem;
            margin-bottom: 3rem;
            color: var(--dark);
        }

        .restart-btn {
            padding: 15px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            margin-top: 2rem;
        }

        .restart-btn:hover {
            background: var(--secondary);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* Modal for images */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: var(--accent);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Page Layout Adjustments */
        .page-content {
            padding-right: 5px;
        }
    </style>
</head>

        // Current slide index
        let currentSlideIndex = 0;
        let totalSlides = 1; // Αρχικά μόνο η εισαγωγική

        // Initialize the application
        function init() {
            createPeriodSlides();
            createThankYouSlide();
            setupEventListeners();
            updateNavigation();
            updateProgressBar();
            updateSlideCounter();
        }

        // Create slides for each historical period
        function createPeriodSlides() {
            const slidesContainer = document.querySelector('.slides-container');
            let slideCount = 1; // Η εισαγωγική είναι ήδη 1

            historicalPeriods.forEach((period, periodIndex) => {
                period.pages.forEach((page, pageIndex) => {
                    const slide = document.createElement('div');
                    slide.className = 'slide';
                    slide.id = `slide-${period.id}-${pageIndex}`;
                    
                    let slideContent = '';
                    
                    if (page.type === "overview") {
                        slideContent = `
                            <div class="header">
                                <h1>${period.title}</h1>
                                <p>${period.years}</p>
                            </div>

                            <div class="main-content">
                                <div class="content-section">
                                    <h2>Βασικά Χαρακτηριστικά</h2>
                                    <div class="page-content">
                                        <div class="info-grid">
                                            <div class="info-card" style="grid-column: 1 / -1;">
                                                <h3>Περιγραφή</h3>
                                                <p>${page.content.description}</p>
                                            </div>
                                            ${page.content.facts.map(fact => `
                                                <div class="info-card">
                                                    <h3>${fact.title}</h3>
                                                    <p>${fact.content}</p>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        slideContent = `
                            <div class="header">
                                <h1>${period.title} - Λεπτομέρειες</h1>
                                <p>${period.years}</p>
                            </div>

                            <div class="main-content">
                                <div class="content-section">
                                    <h2>Περισσότερες Πληροφορίες</h2>
                                    <div class="page-content">
                                        <div class="info-section">
                                            <h3>Ενδιαφέροντα Γεγονότα</h3>
                                            <ul>
                                                ${page.content.interestingFacts.map(fact => `<li>${fact}</li>`).join('')}
                                            </ul>
                                        </div>

                                        <div class="info-section">
                                            <h3>Αρχαιολογικά Ευρήματα</h3>
                                            <ul>
                                                ${page.content.archaeologicalFinds.map(item => `<li>${item}</li>`).join('')}
                                            </ul>
                                        </div>

                                        <div class="info-section">
                                            <h3>Πολιτισμικά Στοιχεία</h3>
                                            <ul>
                                                ${page.content.culturalAspects.map(aspect => `<li>${aspect}</li>`).join('')}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                    
                    slide.innerHTML = slideContent;
                    slidesContainer.appendChild(slide);
                    slideCount++;
                });
            });

            totalSlides = slideCount;
        }

        // Create thank you slide
        function createThankYouSlide() {
            const slidesContainer = document.querySelector('.slides-container');
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.id = 'slide-thankyou';
            
            slide.innerHTML = `
                <div class="header">
                    <h1>Φάρσαλα: 7,000 Χρόνια Ιστορίας</h1>
                    <p>Τέλος παρουσίασης</p>
                </div>

                <div class="thank-you-slide">
                    <h2>Σε ευχαριστούμε που παρακολούθησες αυτή την παρουσίαση</h2>
                    <p>Ελπίζουμε να μάθατε περισσότερα για την πλούσια ιστορία των Φαρσάλων</p>
                    <button class="restart-btn" id="restart-btn">Θέλεις να ξαναδείς την παρουσίαση;</button>
                </div>
            `;
            
            slidesContainer.appendChild(slide);
            totalSlides++;
            
            // Add event listener for restart button
            document.getElementById('restart-btn').addEventListener('click', () => {
                showSlide(0);
            });
        }

        // Show specific slide
        function showSlide(index) {
            // Hide all slides
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
            });
            
            // Show target slide
            document.querySelectorAll('.slide')[index].classList.add('active');
            
            currentSlideIndex = index;
            updateNavigation();
            updateProgressBar();
            updateSlideCounter();

            // Scroll to top when changing slides
            window.scrollTo(0, 0);
        }

        // Update navigation buttons state
        function updateNavigation() {
            document.getElementById('prev-btn').disabled = currentSlideIndex === 0;
            document.getElementById('next-btn').disabled = currentSlideIndex === totalSlides - 1;
        }

        // Update progress bar
        function updateProgressBar() {
            const progress = ((currentSlideIndex + 1) / totalSlides) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        // Update slide counter
        function updateSlideCounter() {
            document.getElementById('slide-counter').textContent = 
                `Σελίδα ${currentSlideIndex + 1} από ${totalSlides}`;
        }

        // Setup event listeners
        function setupEventListeners() {
            // Navigation buttons
            document.getElementById('prev-btn').addEventListener('click', () => {
                if (currentSlideIndex > 0) {
                    showSlide(currentSlideIndex - 1);
                }
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                if (currentSlideIndex < totalSlides - 1) {
                    showSlide(currentSlideIndex + 1);
                }
            });

            // Home button
            document.getElementById('home-btn').addEventListener('click', () => {
                showSlide(0);
            });

            // Modal functionality
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('imageModal').addEventListener('click', (e) => {
                if (e.target.id === 'imageModal') closeModal();
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && currentSlideIndex > 0) {
                    showSlide(currentSlideIndex - 1);
                } else if (e.key === 'ArrowRight' && currentSlideIndex < totalSlides - 1) {
                    showSlide(currentSlideIndex + 1);
                } else if (e.key === 'Escape') {
                    closeModal();
                } else if (e.key === 'Home') {
                    showSlide(0);
                }
            });
        }

        // Modal functions
        function openModal(imageName) {
            document.getElementById('modalImage').alt = imageName;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
